<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeNote 管理后台</title>
    <meta name="theme-color" content="#f5f7fa">
    <link rel="icon" href="/favicon.ico">

    <!--
        首屏防闪脚本：必须在 <body> 之前同步执行，浏览器第一帧就是正确颜色。

        __MENOTE_THEME__ 是服务端占位符，返回外壳时会被替换成后台"站点设置"里的
        主题（见 lib/theme.js）；Vite dev server 直出时它还是字面量，下面的白名单
        校验会把它当非法值退回 auto。

        ⚠️ 与 web/home.html 里的那份完全一致，改一边记得改另一边；
           前端逻辑在 web/src/shared/theme.js。
    -->
    <script>
    (function () {
        var MODES = ['auto', 'light', 'dark'];
        var FALLBACK = '__MENOTE_THEME__';

        var stored = null;
        try { stored = localStorage.getItem('menote-theme'); } catch (e) {}
        if (MODES.indexOf(stored) < 0) stored = null;

        var mode = stored || FALLBACK;
        if (MODES.indexOf(mode) < 0) mode = 'auto';
        if (mode === 'auto') {
            mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }

        var el = document.documentElement;
        el.setAttribute('data-theme', mode);
        el.setAttribute('data-theme-mode', stored || FALLBACK);
        // Element Plus 的暗色变量挂在 html.dark 下，这一行是暗色生效的关键
        if (mode === 'dark') el.className = 'dark';

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'dark' ? '#0c1110' : '#f5f7fa');
    })();
    </script>

    <style>
        /* 兜底底色：主样式表（及懒加载 chunk）到位前先铺上，避免白闪 */
        html { background: #f5f7fa; }
        html[data-theme="dark"] { background: #0c1110; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/admin/main.js"></script>
</body>
</html>
